apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: loki-gateway
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http-loki
      protocol: HTTP
    hosts:
    - loki.liubingjie.com
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: loki
  namespace: istio-system
spec:
  hosts:
  - loki.liubingjie.com
  gateways:
  - loki-gateway
  http:
  - route:
    - destination:
        host: loki.istio-system.svc.cluster.local
        port:
          number: 3100
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: loki
  namespace: istio-system
spec:
  host: loki.istio-system.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
